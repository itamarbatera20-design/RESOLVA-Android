name: Gerar APK RESOLVA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar RESOLVA 2.4.0 (debug + AAB de validação)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/resolva/app
          mkdir -p app/src/main/assets
          cp brand-resolva.svg app/src/main/assets/brand-resolva.svg

          # Gerar os ícones oficiais do Android a partir da marca RESOLVA
          python3 -m pip install --quiet cairosvg
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            pixels="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            python3 -c "import cairosvg; cairosvg.svg2png(url='brand-resolva.svg', write_to='app/src/main/res/mipmap-${density}/ic_launcher.png', output_width=${pixels}, output_height=${pixels})"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          cp RESOLVA_2.0.4.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RESOLVA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.resolva.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.resolva.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 240
                  versionName '2.4.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="RESOLVA"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/resolva/app/MainActivity.java <<'EOF'
          package com.resolva.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.JavascriptInterface;
          import android.content.SharedPreferences;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.util.Base64;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final String PREFS_NAME = "resolva_secure_store";
              private static final String KEY_ALIAS = "RESOLVA_DATA_AES_GCM_V1";
              private SharedPreferences securePrefs;
              private SecretKey getOrCreateKey() throws Exception {
                  java.security.KeyStore ks=java.security.KeyStore.getInstance("AndroidKeyStore"); ks.load(null);
                  java.security.Key k=ks.getKey(KEY_ALIAS,null); if(k instanceof SecretKey)return (SecretKey)k;
                  KeyGenerator kg=KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore");
                  kg.init(new KeyGenParameterSpec.Builder(KEY_ALIAS,KeyProperties.PURPOSE_ENCRYPT|KeyProperties.PURPOSE_DECRYPT)
                    .setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                    .setRandomizedEncryptionRequired(true).build());
                  return kg.generateKey();
              }
              private String encrypt(String v)throws Exception{
                  Cipher c=Cipher.getInstance("AES/GCM/NoPadding");c.init(Cipher.ENCRYPT_MODE,getOrCreateKey());
                  byte[] e=c.doFinal(v.getBytes(StandardCharsets.UTF_8)),iv=c.getIV(),p=new byte[1+iv.length+e.length];
                  p[0]=(byte)iv.length;System.arraycopy(iv,0,p,1,iv.length);System.arraycopy(e,0,p,1+iv.length,e.length);
                  return Base64.encodeToString(p,Base64.NO_WRAP);
              }
              private String decrypt(String v)throws Exception{
                  byte[] p=Base64.decode(v,Base64.NO_WRAP);int n=p[0]&255;if(n<12||p.length<=1+n)throw new IllegalArgumentException("Dados inválidos");
                  byte[] iv=new byte[n],e=new byte[p.length-1-n];System.arraycopy(p,1,iv,0,n);System.arraycopy(p,1+n,e,0,e.length);
                  Cipher c=Cipher.getInstance("AES/GCM/NoPadding");c.init(Cipher.DECRYPT_MODE,getOrCreateKey(),new GCMParameterSpec(128,iv));
                  return new String(c.doFinal(e),StandardCharsets.UTF_8);
              }
              private final class SecureStorageBridge{
                  @JavascriptInterface public String getItem(String n){synchronized(MainActivity.this){try{String v=securePrefs.getString(n,null);return v==null?null:decrypt(v);}catch(Exception e){throw new RuntimeException("Falha ao abrir dados protegidos.",e);}}}
                  @JavascriptInterface public void setItem(String n,String v){synchronized(MainActivity.this){try{securePrefs.edit().putString(n,encrypt(v)).commit();}catch(Exception e){throw new RuntimeException("Falha ao proteger dados.",e);}}}
                  @JavascriptInterface public void removeItem(String n){synchronized(MainActivity.this){securePrefs.edit().remove(n).commit();}}
              }

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  securePrefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                  webView = new WebView(this);
                  setContentView(webView);
                  webView.addJavascriptInterface(new SecureStorageBridge(), "ResolvaSecureStorage");

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  settings.setAllowFileAccessFromFileURLs(false);
                  settings.setAllowUniversalAccessFromFileURLs(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);

                  webView.setWebViewClient(new WebViewClient() {
                      private boolean abrirLinkExterno(String url) {
                          if (url == null) return true;
                          Uri uri = Uri.parse(url);
                          if ("https".equalsIgnoreCase(uri.getScheme())) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) { }
                          }
                          return true;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("file".equalsIgnoreCase(uri.getScheme())) return false;
                          return abrirLinkExterno(uri.toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && url.startsWith("file://")) return false;
                          return abrirLinkExterno(url);
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Preparar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          mv gradle-8.7 /tmp/gradle

      - name: Gerar APK
        run: |
          /tmp/gradle/bin/gradle assembleDebug bundleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RESOLVA-Android-2.4.0
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar AAB de validação (não assinado)
        uses: actions/upload-artifact@v4
        with:
          name: RESOLVA-AAB-UNSIGNED-2.4.0
          path: app/build/outputs/bundle/release/app-release.aab
